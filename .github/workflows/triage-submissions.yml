name: Triage tool submissions

# Runs once when an issue is created. Only validates the Website URL.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          HAS_TRIAGE_TOKEN: ${{ secrets.TRIAGE_TOKEN != '' }}
        with:
          # TRIAGE_TOKEN (PAT/App) is what lets the `validated` label trigger agent-intake.yml;
          # the default GITHUB_TOKEN cannot start other workflow runs. Fall back to it so triage
          # still works without the secret — a warning below flags that auto-intake is disabled.
          github-token: ${{ secrets.TRIAGE_TOKEN || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const author = context.payload.issue.user.login;

            // One open submission per user: block spam before any URL check or LLM run.
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', creator: author, labels: 'tool-suggestion', per_page: 100,
            });
            // Keep the oldest (lowest-numbered) submission so overlapping runs resolve
            // deterministically: only the newer issue gets flagged. Never auto-close — a
            // human decides; we only label and comment.
            const others = existing.data.filter((i) => i.number !== issue_number && !i.pull_request);
            const oldest = others.reduce((min, i) => Math.min(min, i.number), Infinity);
            if (oldest < issue_number) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `<!-- triage-bot -->\nYou already have an open submission in #${oldest}. ` +
                  `Only one open tool submission per person is allowed. ` +
                  `Please wait until #${oldest} is resolved before this one is reviewed.`,
              });
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['rate-limited'] });
              return;
            }

            // First non-empty, non-comment line of a "### Heading" block OR an inline
            // "Heading: value" line (optionally bold/blockquoted). The template block wins when
            // both are present. A Markdown link or <autolink> is unwrapped to its raw value.
            // Kept in sync with scripts/agent/parse-issue.ts.
            const body = (context.payload.issue.body || '').slice(0, 20000);
            const firstLine = (chunk) => (chunk || '')
              .replace(/<!--[\s\S]*?-->/g, '')
              .split('\n').map((l) => l.trim()).find(Boolean) || '';
            const clean = (value) => {
              let v = (value || '').trim();
              const link = v.match(/^\[[^\]]*\]\((\S+?)\)$/);
              if (link) v = link[1].trim();
              const auto = v.match(/^<(\S+)>$/);
              if (auto) v = auto[1].trim();
              return v.trim();
            };
            const field = (heading) => {
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const block = body.match(new RegExp(`### +${escaped}\\s*([\\s\\S]*?)(?=\\n### |\\n---|$)`, 'i'));
              const inline = body.match(new RegExp(`^[>\\s]*[*_]{0,2}${escaped}[*_]{0,2}\\s*:\\s*[*_]{0,2}\\s*(.+)$`, 'im'));
              return clean(firstLine(block && block[1]) || firstLine(inline && inline[1]));
            };

            // Fallback for prose bodies with no labelled field: first valid https URL, with
            // wrappers/trailing punctuation stripped and asset (image) links skipped.
            const findUrl = (text) => {
              const candidates = text.match(/https?:\/\/[^\s<>()[\]]+/gi) || [];
              for (const raw of candidates) {
                const url = raw.replace(/[.,;:!?'")\]]+$/, '');
                try {
                  const u = new URL(url);
                  if (u.protocol !== 'https:') continue;
                  if (!/[^.]\.[^.]/.test(u.hostname)) continue;
                  if (/\.(png|jpe?g|gif|svg|webp|ico|bmp|avif)$/i.test(u.pathname)) continue;
                  return url;
                } catch { continue; }
              }
              return '';
            };

            const fails = [];
            // Validate the Website URL with the WHATWG URL parser (Node built-in, RFC 3986 /
            // URL Standard compliant): must be https and have a dotted host. All other fields
            // are left for human review.
            const isHttpsUrl = (v) => { try { const u = new URL(v); return u.protocol === 'https:' && /[^.]\.[^.]/.test(u.hostname); } catch { return false; } };
            if (!isHttpsUrl(field('Website URL') || findUrl(body))) fails.push('Website URL must be a valid `https://` link.');

            const marker = '<!-- triage-bot -->';
            const label = fails.length ? 'needs-changes' : 'validated';
            const commentBody = `${marker}\nAutomated review (URL check only, no human yet):\n\n` +
              (fails.length ? fails.map((f) => `- ❌ ${f}`).join('\n') : '- ✅ Website URL looks valid.');

            // Post the URL-check result as a comment.
            await github.rest.issues.createComment({ owner, repo, issue_number, body: commentBody });

            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });

            if (label === 'validated' && process.env.HAS_TRIAGE_TOKEN !== 'true') {
              core.warning('TRIAGE_TOKEN secret is not set: the `validated` label was applied with the default token, so agent-intake.yml will NOT auto-trigger. Add TRIAGE_TOKEN (or re-apply the label with a PAT) to enable autonomous intake.');
            }
