name: Agent intake

# Stage 2: runs the autonomous agent only after stage 1 (triage) applies the `validated`
# label to a tool-suggestion issue. Fetches the site, judges AI/ML, writes the listing, and
# opens a PR — or comments the reason and labels. Issues are never auto-closed; a human decides.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      url:
        description: 'Tool URL to run the full agent against (dry run — no PR, no comments).'
        required: true
        type: string

# Least privilege: processing runs read-only; write scopes are granted only to the publish job.
permissions:
  contents: read

concurrency:
  group: agent-intake-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  # Read-only: checkout, install deps, run the agent. Never holds write credentials,
  # so dry runs and a compromised dependency cannot push to the repo.
  process:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.label.name == 'validated' && contains(github.event.issue.labels.*.name, 'tool-suggestion')) }}
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.agent.outputs.decision }}
      branch: ${{ steps.agent.outputs.branch }}
      title: ${{ steps.agent.outputs.title }}
      category: ${{ steps.agent.outputs.category }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - id: agent
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          INPUT_URL: ${{ github.event.inputs.url }}
        run: bun run scripts/agent/intake.ts

      - name: Dry-run summary
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo '### Agent dry-run result' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat agent-result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload agent output
        if: ${{ github.event_name == 'issues' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-output
          # Only tools.json travels to publish; generated shards/slug-map stay out of the PR.
          path: |
            agent-result.json
            src/data/tools.json
          retention-days: 1

  # Write-scoped: only runs for real issue submissions (never dry runs). Replays the
  # agent's file changes from the artifact and publishes the PR or rejection. Runs even
  # when `process` failed so the issue always gets an explanation comment. Gated on the
  # same label condition as `process` so unrelated label events never post a bogus comment.
  publish:
    needs: process
    if: ${{ always() && github.event_name == 'issues' && github.event.label.name == 'validated' && contains(github.event.issue.labels.*.name, 'tool-suggestion') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download agent output
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: agent-output

      # Untrusted values (title) are passed via env, never interpolated into the shell command.
      - name: Commit and push branch
        id: push
        if: ${{ needs.process.result == 'success' && needs.process.outputs.decision == 'pr' }}
        env:
          BRANCH: ${{ needs.process.outputs.branch }}
          TITLE: ${{ needs.process.outputs.title }}
          CATEGORY: ${{ needs.process.outputs.category }}
          AUTHOR: ${{ github.event.issue.user.login }}
          AUTHOR_ID: ${{ github.event.issue.user.id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # CONTRIBUTING.md: a submission edits ONLY tools.json. Slug-map and the per-category
          # shards are generated artifacts and must not appear in the PR.
          git add src/data/tools.json
          git commit -m "Add $TITLE to $CATEGORY" \
            -m "Refs #${{ github.event.issue.number }}" \
            -m "Co-authored-by: $AUTHOR <$AUTHOR_ID+$AUTHOR@users.noreply.github.com>"
          git push origin "$BRANCH"

      # Always runs: whatever happened upstream, the agent's reason must reach the issue.
      - name: Open PR or comment outcome
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          PROCESS_RESULT: ${{ needs.process.result }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- agent-intake -->';

            const flagForReview = async (body, extraLabels = []) => {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: `${marker}\n${body}` });
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['needs-review', ...extraLabels] });
            };

            // Load the agent's result; a missing/corrupt file means the run never completed.
            let result = null;
            try {
              result = JSON.parse(fs.readFileSync('agent-result.json', 'utf8'));
            } catch { /* artifact missing or unreadable */ }

            if (!result) {
              await flagForReview(
                `⚠️ The agent run did not complete (process: ${process.env.PROCESS_RESULT}), so no decision was recorded. ` +
                `A maintainer needs to review this submission manually.`,
              );
              return;
            }

            if (result.decision === 'reject') {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `${marker}\nThe agent could not accept this submission:\n\n- ❌ ${result.reason}`,
              });
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [result.label] });
              // Never auto-close: a human reviews the label and decides whether to close.
              return;
            }

            // Any decision other than an explicit PR is unexpected — still surface the reason.
            if (result.decision !== 'pr') {
              await flagForReview(
                `⚠️ Unexpected agent decision \`${result.decision}\`.\n\n` +
                `**AI/ML judgement:** ${result.reason || 'none provided'} (confidence ${result.confidence ?? 'n/a'}).`,
              );
              return;
            }

            // Approved, but the branch push failed or was skipped: can't open a PR, still post the reason.
            if (process.env.PUSH_OUTCOME !== 'success') {
              await flagForReview(
                `⚠️ The agent approved this tool but the branch could not be published (push: ${process.env.PUSH_OUTCOME || 'did not run'}). ` +
                `A maintainer needs to add it manually.\n\n` +
                `**AI/ML judgement:** ${result.reason} (confidence ${result.confidence}).`,
              );
              return;
            }

            const prBody = [
              `${marker}`,
              `Autonomous submission from #${issue_number}.`,
              '',
              `- **Tool:** ${result.title}`,
              `- **URL:** ${result.finalUrl}`,
              `- **Category:** ${result.category}`,
              `- **Pricing:** ${result.tag}`,
              `- **Description:** ${result.body}`,
              '',
              `**AI/ML judgement:** ${result.reason} (confidence ${result.confidence}).`,
              '',
              `Refs #${issue_number}`,
            ].join('\n');

            let pr;
            try {
              pr = await github.rest.pulls.create({
                owner, repo,
                head: result.branch,
                base: 'main',
                title: `Add ${result.title} to ${result.category}`,
                body: prBody,
              });
            } catch (err) {
              await flagForReview(
                `⚠️ The branch \`${result.branch}\` was pushed but opening the PR failed (${err.message}). ` +
                `A maintainer can open it manually.\n\n` +
                `**AI/ML judgement:** ${result.reason} (confidence ${result.confidence}).`,
              );
              return;
            }

            await github.rest.issues.addLabels({
              owner, repo, issue_number: pr.data.number,
              labels: ['needs-review', 'agent-generated'],
            });

            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: `${marker}\n✅ Opened PR #${pr.data.number} for review.\n\n` +
                `**AI/ML judgement:** ${result.reason} (confidence ${result.confidence}).`,
            });
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['needs-review'] });
